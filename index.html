<head>
<meta charset="utf-8">

<title>Trắc nghiệm ôn tập</title>
<style>
:root{--bg:#f7f7f5;--fg:#1f1f1d;--card:#fff;--bd:#dcdcd6;--ac:#1d6fd6;--ok:#15803d;--okb:#dcfce7;--no:#b91c1c;--nob:#fee2e2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17181a;--fg:#ececea;--card:#222326;--bd:#383a3e;--ac:#6aa9f5;--ok:#4ade80;--okb:#14331f;--no:#f87171;--nob:#3b1818;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#17181a;--fg:#ececea;--card:#222326;--bd:#383a3e;--ac:#6aa9f5;--ok:#4ade80;--okb:#14331f;--no:#f87171;--nob:#3b1818;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;padding:14px}
main{max-width:680px;margin:0 auto}
h1{font-size:1.25rem;margin:0 0 4px}
.top{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:8px 0;z-index:5;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.9rem}
.q{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin:10px 0}
.q h3{font-size:1rem;margin:0 0 8px;font-weight:600}
.o{display:flex;gap:8px;align-items:flex-start;padding:8px 10px;border:1px solid var(--bd);border-radius:8px;margin:6px 0;cursor:pointer}
.o b{color:var(--ac);min-width:1.2ch}
.o.sel{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 12%,transparent)}
.o.ok{border-color:var(--ok);background:var(--okb)}
.o.bad{border-color:var(--no);background:var(--nob)}
.done .o{cursor:default}
button{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:10px 16px;font:inherit;font-weight:600}
button.g{background:transparent;color:var(--ac);border:1px solid var(--ac)}
#res{font-weight:700;font-size:1.1rem;margin:10px 0}
.note{font-size:.8rem;opacity:.7;margin-top:6px}
</style>
</head>
<body>
<main>

</main>

var L="ABCD",S=[],done=false,list=document.getElementById("list");
function render(){
  list.className=done?"done":"";list.innerHTML="";
  D.forEach(function(q,i){
    var c=document.createElement("div");c.className="q";
    c.innerHTML="<h3>Câu "+(i+1)+". "+q[0]+"</h3>";
    q[1].forEach(function(t,j){
      var o=document.createElement("div");o.className="o";
      if(done){if(j===q[2])o.className+=" ok";else if(S[i]===j)o.className+=" bad";}
      else if(S[i]===j)o.className+=" sel";
      o.innerHTML="<b>"+L[j]+".</b><span>"+t+"</span>";
      o.onclick=function(){if(done)return;S[i]=j;render();};
      c.appendChild(o);
    });
    list.appendChild(c);
  });
  var n=S.filter(function(x){return x!==undefined}).length;
  document.getElementById("prog").textContent="Đã chọn "+n+"/40";
}

  var s=0;D.forEach(function(q,i){if(S[i]===q[2])s++;});
  done=true;document.getElementById("res").textContent="Điểm: "+s+"/40";render();window.scrollTo(0,0);
